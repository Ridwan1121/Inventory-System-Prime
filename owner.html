<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner Panel - Prime Inventory System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .topbar { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; }
        .logo-text { font-weight: 800; font-size: 1.1rem; }
        .logo-text span { color: #f59e0b; }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-menu img { width: 36px; height: 36px; border-radius: 50%; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .page-title i { color: #f59e0b; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 16px; }
        .stat-value { font-size: 2rem; font-weight: 800; margin-bottom: 4px; }
        .stat-label { color: #94a3b8; font-size: 0.85rem; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: #1e293b; padding: 6px; border-radius: 12px; width: fit-content; }
        .tab { padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; font-family: 'Inter', sans-serif; background: transparent; color: #94a3b8; transition: all 0.3s; }
        .tab.active { background: #f59e0b; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #1e293b; border-radius: 16px; border: 1px solid #334155; overflow: hidden; margin-bottom: 20px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .card-header h3 i { color: #f59e0b; }
        .card-body { padding: 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead th { text-align: left; padding: 12px; font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; }
        tbody td { padding: 12px; border-bottom: 1px solid #1e293b; color: #f8fafc; }
        tbody tr:hover { background: #0f172a; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge-active { background: #065f46; color: #6ee7b7; }
        .badge-suspended { background: #991b1b; color: #fca5a5; }
        .badge-free { background: #334155; color: #94a3b8; }
        .badge-starter { background: #1e40af; color: #93c5fd; }
        .badge-professional { background: #6d28d9; color: #c4b5fd; }
        .badge-enterprise { background: #b45309; color: #fde68a; }
        .badge-ultimate { background: #831843; color: #f9a8d4; }
        .btn-sm { padding: 6px 12px; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; margin-right: 4px; }
        .btn-edit { background: #dbeafe; color: #1e40af; }
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-suspend { background: #fef3c7; color: #92400e; }
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .tabs { flex-wrap: wrap; }
            table { font-size: 0.75rem; }
            thead th, tbody td { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-crown"></i></div>
            <div class="logo-text">Prime <span>Owner</span></div>
        </div>
        <div class="user-menu">
            <img src="https://ui-avatars.com/api/?name=System+Owner&background=f59e0b&color=fff" alt="Owner" />
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title"><i class="fas fa-tachometer-alt"></i> Owner Dashboard</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background:#dbeafe;color:#1e40af;"><i class="fas fa-building"></i></div>
                <div class="stat-value" id="totalTenants">0</div>
                <div class="stat-label">Total Tenants</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#d1fae5;color:#065f46;"><i class="fas fa-check-circle"></i></div>
                <div class="stat-value" id="activeTenants">0</div>
                <div class="stat-label">Active Tenants</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#fef3c7;color:#92400e;"><i class="fas fa-dollar-sign"></i></div>
                <div class="stat-value" id="monthlyRevenue">$0</div>
                <div class="stat-label">Monthly Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#ede9fe;color:#6d28d9;"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="activeSchedules">0</div>
                <div class="stat-label">Active Schedules</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('tenants')"><i class="fas fa-building"></i> Tenants</button>
            <button class="tab" onclick="switchTab('subscriptions')"><i class="fas fa-credit-card"></i> Subscriptions</button>
            <button class="tab" onclick="switchTab('audit')"><i class="fas fa-history"></i> Audit Logs</button>
        </div>

        <!-- Tenants Tab -->
        <div class="tab-content active" id="tenants">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-building"></i> All Tenants</h3>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Business</th>
                                <th>Owner</th>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tenantsTable">
                            <tr><td colspan="6" style="text-align:center;color:#94a3b8;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Subscriptions Tab -->
        <div class="tab-content" id="subscriptions">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-credit-card"></i> All Subscriptions</h3>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Tenant</th>
                                <th>Plan</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Expires</th>
                            </tr>
                        </thead>
                        <tbody id="subscriptionsTable">
                            <tr><td colspan="5" style="text-align:center;color:#94a3b8;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Audit Tab -->
        <div class="tab-content" id="audit">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-history"></i> Audit Logs</h3>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Action</th>
                                <th>Details</th>
                                <th>IP</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="auditTable">
                            <tr><td colspan="5" style="text-align:center;color:#94a3b8;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('ownerToken');
        if (!token) window.location.href = '/login';

        const headers = { 'Authorization': 'Bearer ' + token };

        async function loadDashboard() {
            try {
                const res = await fetch('/api/owner/dashboard', { headers });
                if (!res.ok) { logout(); return; }
                const data = await res.json();
                document.getElementById('totalTenants').textContent = data.totalTenants || 0;
                document.getElementById('activeTenants').textContent = data.activeTenants || 0;
                document.getElementById('monthlyRevenue').textContent = '$' + (data.monthlyRevenue || 0).toFixed(2);
                document.getElementById('activeSchedules').textContent = data.activeSchedules || 0;
            } catch (e) { console.error(e); }
        }

        async function loadTenants() {
            try {
                const res = await fetch('/api/owner/tenants', { headers });
                const tenants = await res.json();
                const tbody = document.getElementById('tenantsTable');
                if (!tenants.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;">No tenants yet</td></tr>'; return; }
                tbody.innerHTML = tenants.map(t => `
                    <tr>
                        <td><strong>${t.business_name}</strong></td>
                        <td>${t.name}</td>
                        <td>${t.email}</td>
                        <td><span class="badge badge-${t.plan}">${t.plan}</span></td>
                        <td><span class="badge badge-${t.status === 'active' ? 'active' : 'suspended'}">${t.status}</span></td>
                        <td>
                            <button class="btn-sm btn-suspend" onclick="toggleStatus(${t.id}, '${t.status}')">
                                ${t.status === 'active' ? 'Suspend' : 'Activate'}
                            </button>
                            <button class="btn-sm btn-delete" onclick="deleteTenant(${t.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function loadSubscriptions() {
            try {
                const res = await fetch('/api/owner/subscriptions', { headers });
                const subs = await res.json();
                const tbody = document.getElementById('subscriptionsTable');
                if (!subs.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;">No subscriptions</td></tr>'; return; }
                tbody.innerHTML = subs.map(s => `
                    <tr>
                        <td>${s.business_name}</td>
                        <td><span class="badge badge-${s.plan}">${s.plan}</span></td>
                        <td>$${s.amount.toFixed(2)}</td>
                        <td><span class="badge badge-active">${s.status}</span></td>
                        <td>${s.expires_at ? new Date(s.expires_at).toLocaleDateString() : 'N/A'}</td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function loadAuditLogs() {
            try {
                const res = await fetch('/api/owner/audit-logs', { headers });
                const logs = await res.json();
                const tbody = document.getElementById('auditTable');
                if (!logs.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;">No logs</td></tr>'; return; }
                tbody.innerHTML = logs.slice(0, 100).map(l => `
                    <tr>
                        <td>${l.user_type || 'N/A'} #${l.user_id || '-'}</td>
                        <td><strong>${l.action}</strong></td>
                        <td>${l.details || '-'}</td>
                        <td>${l.ip_address || '-'}</td>
                        <td>${new Date(l.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'active' ? 'suspended' : 'active';
            if (!confirm(`Change status to ${newStatus}?`)) return;
            try {
                await fetch(`/api/owner/tenants/${id}/status`, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                loadTenants();
            } catch (e) { console.error(e); }
        }

        async function deleteTenant(id) {
            if (!confirm('Delete this tenant? This cannot be undone!')) return;
            try {
                await fetch(`/api/owner/tenants/${id}`, { method: 'DELETE', headers });
                loadTenants();
            } catch (e) { console.error(e); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
            if (tab === 'tenants') loadTenants();
            if (tab === 'subscriptions') loadSubscriptions();
            if (tab === 'audit') loadAuditLogs();
        }

        function logout() {
            localStorage.removeItem('ownerToken');
            localStorage.removeItem('owner');
            window.location.href = '/login';
        }

        loadDashboard();
        loadTenants();
    </script>
</body>
</html>
