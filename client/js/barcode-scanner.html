<!-- Barcode Scanner Component -->
<!-- Ku dar dashboard.html ama stock page -->

<div class="barcode-scanner" id="barcodeScanner" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
    <video id="barcodeVideo" style="max-width:100%; max-height:70vh; border-radius:12px;"></video>
    <div style="margin-top:20px; display:flex; gap:12px;">
        <button onclick="stopBarcodeScanner()" style="background:#ef4444; color:white; border:none; padding:12px 24px; border-radius:10px; font-weight:600; cursor:pointer;">
            <i class="fas fa-times"></i> Xir
        </button>
    </div>
    <p style="color:white; margin-top:16px;">Barcode-ka ku qabso kamarada</p>
</div>

<button onclick="startBarcodeScanner()" class="btn-primary" style="margin-top:12px;">
    <i class="fas fa-barcode"></i> Scan Barcode
</button>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
    let barcodeScanner = null;
    
    async function startBarcodeScanner() {
        const scanner = document.getElementById('barcodeScanner');
        const video = document.getElementById('barcodeVideo');
        scanner.style.display = 'flex';
        
        try {
            const codeReader = new ZXing.BrowserMultiFormatReader();
            barcodeScanner = codeReader;
            
            const result = await codeReader.decodeFromVideoDevice(
                null,
                video,
                (result, error) => {
                    if (result) {
                        console.log('Barcode:', result.text);
                        stopBarcodeScanner();
                        // Ku dar product form
                        if (document.getElementById('prodSku')) {
                            document.getElementById('prodSku').value = result.text;
                            alert('✅ Barcode: ' + result.text);
                        }
                    }
                }
            );
        } catch (error) {
            console.error('Barcode error:', error);
            alert('❌ Kamarada lama helin: ' + error.message);
            stopBarcodeScanner();
        }
    }
    
    function stopBarcodeScanner() {
        if (barcodeScanner) {
            barcodeScanner.reset();
            barcodeScanner = null;
        }
        document.getElementById('barcodeScanner').style.display = 'none';
    }
</script>
